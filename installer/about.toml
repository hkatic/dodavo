# cargo-about configuration for res/third-party-licenses.txt, the licenses of
# the crates built into Dodavo.exe, which their licenses require to be passed
# on with the program. installer\licenses.ps1 runs it; see there.

# Only what is compiled into the program for Windows (also the win7 targets,
# which have the same dependencies).
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Dodavo itself (publish = false in Cargo.toml).
private = { ignore = true }

# Every license here is compatible with the GNU GPL, version 3, under which
# Dodavo is released. Crates that are only used while compiling, such as
# procedural macros, are listed too. For crates that offer a choice, the
# first one listed wins: MIT, whose text is short and needs nothing besides
# the notice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
]
