# Every build links the C runtime statically, so Dodavo.exe does not depend on
# vcruntime140.dll or the Universal CRT (which Windows 7 only has after an
# update, and which even a fresh Windows 10/11 may lack without a Visual C++
# redistributable). The win7 targets are Tier 3 and are built by
# installer\build.ps1 with a pinned nightly and -Zbuild-std; see README.md.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Android: shared libraries aligned to 16 KB pages, as Google Play requires
# (NDK r28 and later link that way by default; this keeps it so), and tests
# that run on the connected device (see android/test-on-device.sh).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
runner = "android/test-on-device.sh"

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
runner = "android/test-on-device.sh"
