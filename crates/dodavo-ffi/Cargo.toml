[package]
name = "dodavo-ffi"
version = "1.1.0"
edition = "2024"
description = "The library behind the Mac user interface of Dodavo"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "dodavo_ffi"
crate-type = ["staticlib", "rlib"]
doctest = false

[dependencies]
dodavo = { path = "../.." }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
