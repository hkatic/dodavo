name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # The tests read committed files such as the help pages and the license,
      # so they get the bytes that were committed.
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked
      - name: Check the imports against the Windows baseline
        run: powershell -ExecutionPolicy Bypass -File installer\check-imports.ps1 target\release\Dodavo.exe
      # Kept with each run, so that a change that loses a test shows up.
      - name: List the tests
        run: cargo test --locked -- --list > tests-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tests-windows
          path: tests-windows.txt
      # One at a time: the network tests start real iroh endpoints.
      - name: Test
        run: cargo test --locked -- --test-threads=1

  # What a release contains: all four programs, each with the import check of
  # its Windows versions, and Setup. The Windows 7 programs are only built and
  # checked here. Setup is unsigned: a release is built and signed elsewhere.
  windows-all-builds:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-about.exe
            target
          key: windows-all-${{ hashFiles('Cargo.lock') }}
      # installer\licenses.ps1 needs it.
      - name: Install cargo-about
        run: |
          if (-not (Get-Command cargo-about -ErrorAction SilentlyContinue)) {
            cargo install cargo-about --locked --features cli
          }
      - name: Build all programs and Setup
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Dodavo-setup-unsigned
          path: target/installer/Dodavo-*-setup.exe*
          if-no-files-found: error
          retention-days: 14
      # One at a time: the network tests start real iroh endpoints.
      - name: Test the 32-bit program
        run: cargo test --locked --target i686-pc-windows-msvc -- --test-threads=1

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ hashFiles('Cargo.lock') }}
      # See ISSUES.md: on this runner, four tests that reconnect after a restart
      # time out, which they do not on a Mac elsewhere.
      - name: Test
        run: >-
          cargo test --locked --workspace -- --test-threads=1
          --skip a_cancel_waits_for_the_verdict_across_a_restart
          --skip a_send_needs_its_data_again_when_the_receiver_lacks_it
          --skip finish_alone_after_restart_during_unpacking
          --skip a_new_identity_waits_for_a_send_the_receiver_may_have
      - name: Test what reconnects after a restart
        continue-on-error: true
        run: >-
          cargo test --locked --lib -- --test-threads=1
          a_cancel_waits_for_the_verdict_across_a_restart
          a_send_needs_its_data_again_when_the_receiver_lacks_it
          finish_alone_after_restart_during_unpacking
          a_new_identity_waits_for_a_send_the_receiver_may_have
      - name: Build the app
        run: macos/build.sh --debug

  # Linux runs the core's tests with the POSIX code that Android uses; then the
  # Android app is built with its native library, linted, its unit tests run,
  # and the library checked (android/check-elf.sh). Nothing runs on a device
  # here: android/test-on-device.sh and the instrumented tests do that.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked --version 4.1.2
      # One at a time: the network tests start real iroh endpoints.
      - name: Test on Linux
        run: cargo test --locked --workspace -- --test-threads=1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null
      - name: Build, lint and test the app
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - name: Check the native library
        run: android/check-elf.sh android/app/build/outputs/bundle/release/app-release.aab
      # Unsigned: a release is signed elsewhere (android/release.sh).
      - uses: actions/upload-artifact@v7
        with:
          name: Dodavo-android-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
