[workspace]
members = ["crates/dodavo-ffi"]

[package]
name = "dodavo"
version = "1.0.0"
edition = "2024"
description = "Dodavo – send files and folders directly between computers"
authors = ["Hrvoje Katić"]
license = "GPL-3.0-or-later"
repository = "https://github.com/hkatic/dodavo"
# A program, not a library for crates.io.
publish = false

# Version, authors and repository above, and the years here, are the only
# copies: build.rs passes them to the program and its version resource, from
# which Setup takes them (installer\Dodavo.iss). README.md repeats the
# copyright line; a test checks it.
[package.metadata.dodavo]
copyright-years = "2026"

# What does not depend on a user interface. A separate library, so that each
# platform's user interface can build on it.
[lib]
name = "dodavo_core"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "Dodavo"
path = "src/main.rs"

# The release tool (key generation, signing and the update manifest) is built
# only on request: `cargo build --release --features release-tool --bin dodavo-release`.
[[bin]]
name = "dodavo-release"
path = "src/bin/dodavo-release.rs"
required-features = ["release-tool"]

[features]
release-tool = []

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
iroh = "1.4"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
iroh-mdns-address-lookup = "0.6"
rand = "0.10"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "fs", "io-util", "macros", "time"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Update check and download. These crates (with exactly these features) are
# already part of iroh's dependency tree, so nothing new is compiled.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"
ed25519-dalek = "3"
sha2 = { version = "0.11", default-features = false }
tokio-util = { version = "0.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
